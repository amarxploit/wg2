name: SKYGRID API Health Monitor

on:
  schedule:
    # GitHub scheduled workflows are best-effort and may be delayed.
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check SKYGRID API health
        env:
          SKYGRID_API_URL: https://skygrid-backend.onrender.com
        run: |
          set -eu
          url="${SKYGRID_API_URL%/}/health"
          echo "Checking ${url}"
          code="$(curl --silent --show-error --location --max-time 20 --output /tmp/health.json --write-out '%{http_code}' "$url")"
          cat /tmp/health.json
          echo
          if [ "$code" != "200" ]; then
            echo "Health check failed with HTTP ${code}."
            exit 1
          fi
          echo "SKYGRID API returned HTTP 200."
